logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://backend:44336/api/viewer/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: false
metrics: false
pprof: false
playback: false

rtsp: true
rtspTransports: [tcp]
rtspAddress: :8554
rtmp: false
hls: true
hlsAddress: :8888
hlsAllowOrigins: ['https://rs.zerav.la']
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 8M
hlsMuxerCloseAfter: 20s
# Set at runtime through MTX_HLSCDNSECRET. Requests with this credential are
# already authorized by the backend and do not use MediaMTX browser cookies.
hlsCDNSecret: ""
srt: false

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['https://rs.zerav.la']
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: []
webrtcICEServers2: []

pathDefaults:
  source: publisher
  overridePublisher: false
  # LL-HLS uses one muxer reader and one CDN session reader. The third slot
  # allows a brief WHEP fallback overlap while the HLS muxer closes.
  maxReaders: 3

paths:
  all_others:
