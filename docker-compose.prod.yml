name: robotswarm

services:
  db:
    image: postgres:17.0
    container_name: db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swarm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  backend:
    image: ${BACKEND_IMAGE:-swarmbackend:latest}
    container_name: backend_prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      # Kept during the first rollout so the pre-control-plane image can still
      # start if the workflow has to roll back.
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - AppSettings__Secret=${AppSettings__Secret}
      - AppSettings__Issuer=${AppSettings__Issuer}
      - Cors__Origins__0=${Cors__Origins__0}
      - Accounts__PublicRegistrationEnabled=${Accounts__PublicRegistrationEnabled:-false}
      - RateLimits__Authentication__PermitLimit=${RateLimits__Authentication__PermitLimit:-10}
      - RateLimits__Authentication__WindowSeconds=${RateLimits__Authentication__WindowSeconds:-60}
      - RateLimits__Registration__PermitLimit=${RateLimits__Registration__PermitLimit:-3}
      - RateLimits__Registration__WindowMinutes=${RateLimits__Registration__WindowMinutes:-60}
      - RateLimits__SessionCreation__PermitLimit=${RateLimits__SessionCreation__PermitLimit:-6}
      - RateLimits__SessionCreation__WindowSeconds=${RateLimits__SessionCreation__WindowSeconds:-60}
      - RateLimits__ViewerHls__TokenLimit=${RateLimits__ViewerHls__TokenLimit:-120}
      - RateLimits__ViewerHls__TokensPerSecond=${RateLimits__ViewerHls__TokensPerSecond:-60}
      - ReverseProxy__KnownProxies__0=${ReverseProxy__KnownProxies__0:-}
      - LegacyControl__Enabled=${LegacyControl__Enabled:-false}
      - Tasks__RequireCollaborativeTransportEvidence=${Tasks__RequireCollaborativeTransportEvidence:-false}
      - Viewer__PublicBaseUrl=${Viewer__PublicBaseUrl:-}
      - Viewer__WorkerPublishingEnabled=${Viewer__WorkerPublishingEnabled:-false}
      - Viewer__HlsProxyEnabled=${Viewer__HlsProxyEnabled:-false}
      - Viewer__HlsPublicBaseUrl=${Viewer__HlsPublicBaseUrl:-}
      - Viewer__HlsOriginBaseUrl=http://media:8888
      - Viewer__HlsCdnSecret=${MEDIA_HLS_CDN_SECRET:-}
      - Viewer__HlsUpstreamTimeoutSeconds=${Viewer__HlsUpstreamTimeoutSeconds:-15}
      - Viewer__LeaseMinutes=${VIEWER_LEASE_MINUTES:-15}
      - BootstrapAdmin__Email=${BootstrapAdmin__Email:-}
      - BootstrapAdmin__Password=${BootstrapAdmin__Password:-}
      - Workers__OrphanAfterSeconds=${Workers__OrphanAfterSeconds:-90}
      - Sessions__MaxRobotsPerSession=${Sessions__MaxRobotsPerSession:-10}
      - Sessions__MaxQueuedSessions=${Sessions__MaxQueuedSessions:-25}
      - Sessions__QueueTtlMinutes=${Sessions__QueueTtlMinutes:-30}
      - Sessions__SessionTtlMinutes=${Sessions__SessionTtlMinutes:-180}
    ports:
      - "${BACKEND_PUBLISH_IP:-127.0.0.1}:44336:44336"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - swarm_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:44336/health >/dev/null || curl --fail --silent http://127.0.0.1:44336/swagger/index.html >/dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  media:
    image: ${MEDIA_IMAGE:-bluenviron/mediamtx@sha256:f8628851106cc053f9175b248050bb5f362a6e65abd72297c167a1cb5a9a3be2}
    container_name: media_prod
    restart: always
    environment:
      - MTX_HLSCDNSECRET=${MEDIA_HLS_CDN_SECRET:-}
    depends_on:
      - backend
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIA_PUBLISH_IP:-127.0.0.1}:8554:8554"
      - "127.0.0.1:8889:8889"
      - "${MEDIA_WEBRTC_IP:-127.0.0.1}:8189:8189/udp"
    networks:
      - swarm_network
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:

networks:
  swarm_network:
    driver: bridge
