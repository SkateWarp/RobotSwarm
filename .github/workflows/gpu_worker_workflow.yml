name: Deploy GPU Swarm Worker

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main-branch SHA whose Check project run succeeded
        required: true
        type: string
      confirm_backend_ready:
        description: The backend for this SHA is deployed, or this is a backward-compatible worker-only change
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: production-robotswarm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [wsl, gpu, gpu-worker-prod]
    environment: gpu-worker-production
    timeout-minutes: 90
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      BACKEND_CONFIRMED: ${{ inputs.confirm_backend_ready }}
      GPU_REQUEST: ${{ vars.GPU_WORKER_GPU_REQUEST || 'device=0' }}
      HARNESS_SHA: ${{ github.workflow_sha }}
      ROS_IMAGE_REPOSITORY: robotswarm/ros-noetic
      WORKFLOW_REF: ${{ github.ref }}

    steps:
      - name: Verify successful main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$BACKEND_CONFIRMED" = "true"
          test "$WORKFLOW_REF" = "refs/heads/main"

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          revision = os.environ["DEPLOY_SHA"]
          token = os.environ["GH_TOKEN"]
          query = urllib.parse.urlencode(
              {
                  "branch": "main",
                  "event": "push",
                  "head_sha": revision,
                  "status": "completed",
                  "per_page": 20,
              }
          )
          url = (
              f"https://api.github.com/repos/{repository}"
              f"/actions/workflows/ci.yml/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])

          passed = any(
              run.get("conclusion") == "success"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == revision
              for run in runs
          )
          if not passed:
              raise SystemExit(
                  "No successful Check project push run exists for this main SHA."
              )
          PY

      - name: Acquire scheduling drain lease
        id: drain
        shell: bash
        run: |
          set -euo pipefail

          identity_file="$HOME/.config/robotswarm/gpu-worker-identity.env"
          test -r "$identity_file"
          set -a
          # The identity file is owner-only and maintained by the deployment host.
          source "$identity_file"
          set +a

          backend_url="${Worker__BackendUrl%/}"
          backend_url="${backend_url%/hubs/worker}"
          credential="${Worker__WorkerId}.${Worker__WorkerSecret}"
          response_file="$RUNNER_TEMP/robotswarm-drain-acquire.json"
          request_file="$RUNNER_TEMP/robotswarm-drain-request.json"
          DEPLOY_SHA="$DEPLOY_SHA" python3 - <<'PY' >"$request_file"
          import json
          import os

          print(json.dumps({"targetRevision": os.environ["DEPLOY_SHA"]}))
          PY

          status="$({
            curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $credential" \
              --header 'Content-Type: application/json' \
              --data-binary "@$request_file" \
              "$backend_url/api/worker-maintenance/drain"
          })"
          unset credential Worker__WorkerSecret
          test "$status" = "200"

          read -r lease_id target_revision < <(
            python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              status = json.load(stream)
          print(status["leaseId"], status["targetRevision"])
          PY
          )
          test "$target_revision" = "$DEPLOY_SHA"
          [[ "$lease_id" =~ ^[a-fA-F0-9-]{36}$ ]]
          echo "lease_id=$lease_id" >> "$GITHUB_OUTPUT"
          echo "backend_url=$backend_url" >> "$GITHUB_OUTPUT"

      - name: Wait for active sessions to drain
        shell: bash
        env:
          DRAIN_LEASE_ID: ${{ steps.drain.outputs.lease_id }}
          DRAIN_BACKEND_URL: ${{ steps.drain.outputs.backend_url }}
        run: |
          set -euo pipefail

          identity_file="$HOME/.config/robotswarm/gpu-worker-identity.env"
          deadline=$((SECONDS + 900))
          while true; do
            set -a
            source "$identity_file"
            set +a
            credential="${Worker__WorkerId}.${Worker__WorkerSecret}"
            if ! status="$({
              curl --silent --show-error --fail \
                --connect-timeout 5 \
                --max-time 20 \
                --header "Authorization: Bearer $credential" \
                "$DRAIN_BACKEND_URL/api/worker-maintenance/drain/$DRAIN_LEASE_ID"
            })"
            then
              unset credential Worker__WorkerSecret
              if (( SECONDS >= deadline )); then
                echo "The drain status endpoint remained unavailable for 15 minutes." >&2
                exit 1
              fi
              echo "Drain status request failed; retrying in 10 seconds." >&2
              sleep 10
              continue
            fi
            unset credential Worker__WorkerSecret

            read -r is_drained tracked reported < <(
              STATUS="$status" python3 - <<'PY'
          import json
          import os

          status = json.loads(os.environ["STATUS"])
          reported = status.get("reportedActiveSessionCount")
          print(
              str(status["isDrained"]).lower(),
              status["trackedSessionCount"],
              "unknown" if reported is None else reported,
          )
          PY
            )
            echo "Drain status: tracked=$tracked worker-reported=$reported"
            if test "$is_drained" = "true"; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "The worker did not drain within 15 minutes." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Check out protected deployment harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: _deploy/deploy-harness
          persist-credentials: false
          sparse-checkout: deploy/gpu-worker

      - name: Check out tested source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          path: _deploy/gpu-source
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.422"

      - name: Check WSL GPU runner
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          grep -qi microsoft /proc/sys/kernel/osrelease
          command -v docker
          command -v python3
          command -v systemctl

          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
          grep -Fq \
            "Worker ready for control-plane commands. ImageVersion={ImageVersion}" \
            SwarmWorker/Services/WorkerAgent.cs

          runtime_dir="/run/user/$(id -u)"
          test -d "$runtime_dir"
          test -S "$runtime_dir/bus"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"

          systemctl --user show-environment >/dev/null
          docker version
          docker info >/dev/null
          test -s "$HOME/.config/robotswarm/gpu-worker-identity.env"

          running_sessions="$(
            docker ps --quiet \
              --filter "label=io.robotswarm.managed=true"
          )"
          if test -n "$running_sessions"; then
            echo "Managed simulation containers are still running." >&2
            exit 1
          fi

          case "$GPU_REQUEST" in
            all|device=*) ;;
            *)
              echo "GPU_REQUEST must be 'all' or a Docker device request." >&2
              exit 1
              ;;
          esac

      - name: Test GPU worker
        working-directory: _deploy/gpu-source
        run: dotnet test SwarmWorker.Tests/SwarmWorker.Tests.csproj --configuration Release

      - name: Test viewer publisher helper
        working-directory: _deploy/gpu-source
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/robotswarm-viewer-pycache" \
            python3 -m py_compile deploy/gpu-worker/robotswarm-viewer-publisher
          deploy/gpu-worker/test-viewer-publisher.sh

      - name: Test atomic worker deployment
        working-directory: _deploy/deploy-harness
        run: deploy/gpu-worker/test-deploy.sh

      - name: Test swarm algorithms
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=swarm_ws/src/robot_swarm_bridge/src:swarm_ws/src/robot_swarm_bridge/scripts \
            python3 -m unittest discover \
              -s swarm_ws/src/robot_swarm_bridge/test \
              -p "test_*.py" \
              -v

      - name: Build immutable ROS image
        id: ros_image
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          image_tag="${ROS_IMAGE_REPOSITORY}:git-${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            --label "io.robotswarm.github-run=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --tag "$image_tag" \
            --file swarm_ws/Dockerfile \
            swarm_ws

          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Docker returned an invalid image ID: $image_id" >&2
            exit 1
          fi

          image_revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$image_id"
          )"
          test "$image_revision" = "$DEPLOY_SHA"

          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Smoke-test ROS and NVIDIA runtime
        shell: bash
        working-directory: _deploy/gpu-source
        env:
          ROS_IMAGE_ID: ${{ steps.ros_image.outputs.image_id }}
        run: |
          set -euo pipefail

          docker run --rm "$ROS_IMAGE_ID" \
            roslaunch --nodes robot_swarm_bridge swarm_main.launch \
              robot_count:=0 gui:=false rviz:=false

          docker run --rm --gpus "$GPU_REQUEST" "$ROS_IMAGE_ID" \
            nvidia-smi --query-gpu=name,driver_version --format=csv,noheader

      - name: Publish self-contained worker
        id: worker_publish
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          publish_dir="${RUNNER_TEMP}/robotswarm-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$publish_dir"
          mkdir -p "$publish_dir"

          dotnet publish SwarmWorker/SwarmWorker.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output "$publish_dir"

          install -m 0755 \
            deploy/gpu-worker/robotswarm-viewer-publisher \
            "$publish_dir/robotswarm-viewer-publisher"

          test -x "$publish_dir/SwarmWorker"
          test "$(stat -c '%a' "$publish_dir/robotswarm-viewer-publisher")" = "755"
          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Verify scheduling drain lease
        shell: bash
        env:
          DRAIN_LEASE_ID: ${{ steps.drain.outputs.lease_id }}
          DRAIN_BACKEND_URL: ${{ steps.drain.outputs.backend_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          identity_file="$HOME/.config/robotswarm/gpu-worker-identity.env"
          set -a
          source "$identity_file"
          set +a
          credential="${Worker__WorkerId}.${Worker__WorkerSecret}"
          response="$({
            curl --silent --show-error --fail \
              --connect-timeout 5 \
              --max-time 20 \
              --header "Authorization: Bearer $credential" \
              "$DRAIN_BACKEND_URL/api/worker-maintenance/drain/$DRAIN_LEASE_ID"
          })"
          unset credential Worker__WorkerSecret

          RESPONSE="$response" DEPLOY_SHA="$DEPLOY_SHA" python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          import os

          status = json.loads(os.environ["RESPONSE"])
          expires = datetime.fromisoformat(status["expiresAt"].replace("Z", "+00:00"))
          if expires.tzinfo is None:
              # PostgreSQL's timestamp-without-time-zone values are UTC, but an
              # older backend can serialize them without the explicit suffix.
              expires = expires.replace(tzinfo=timezone.utc)
          else:
              expires = expires.astimezone(timezone.utc)
          if status["targetRevision"] != os.environ["DEPLOY_SHA"]:
              raise SystemExit("Drain lease targets a different revision.")
          if not status["isDrained"]:
              raise SystemExit("Backend no longer reports the worker as drained.")
          if expires <= datetime.now(timezone.utc) + timedelta(minutes=10):
              raise SystemExit("Drain lease expires too soon for a safe deployment.")
          PY

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              current_main = json.load(response)["object"]["sha"]

          if current_main != os.environ["DEPLOY_SHA"]:
              raise SystemExit(
                  "Main advanced after validation; refusing to deploy a stale GPU revision."
              )
          PY

      - name: Snapshot current worker release
        id: worker_snapshot
        shell: bash
        run: |
          set -euo pipefail

          current_link="$HOME/.local/share/robotswarm-gpu-worker/current"
          installed_unit="$HOME/.config/systemd/user/robotswarm-gpu-worker.service"

          previous_target="absent"
          previous_release_digest="absent"
          if [[ -L "$current_link" ]]; then
            previous_target="$(readlink -f "$current_link")"
            test -d "$previous_target"
            previous_release_digest="$(
              find "$previous_target" -type f -print0 \
                | sort --zero-terminated \
                | xargs --null --no-run-if-empty sha256sum \
                | sha256sum \
                | cut -d ' ' -f 1
            )"
            [[ "$previous_release_digest" =~ ^[a-f0-9]{64}$ ]]
          else
            test ! -e "$current_link"
          fi

          previous_unit_digest="absent"
          if [[ -f "$installed_unit" ]]; then
            previous_unit_digest="$(sha256sum "$installed_unit" | cut -d ' ' -f 1)"
            [[ "$previous_unit_digest" =~ ^[a-f0-9]{64}$ ]]
          else
            test ! -e "$installed_unit"
          fi

          echo "previous_target=$previous_target" >> "$GITHUB_OUTPUT"
          echo "previous_release_digest=$previous_release_digest" >> "$GITHUB_OUTPUT"
          echo "previous_unit_digest=$previous_unit_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy worker and verify readiness
        id: worker_deploy
        shell: bash
        working-directory: _deploy/deploy-harness
        env:
          ROS_IMAGE_ID: ${{ steps.ros_image.outputs.image_id }}
          WORKER_PUBLISH_DIR: ${{ steps.worker_publish.outputs.publish_dir }}
        run: |
          set -euo pipefail

          deploy/gpu-worker/deploy.sh \
            --publish-dir "$WORKER_PUBLISH_DIR" \
            --image-id "$ROS_IMAGE_ID" \
            --revision "$DEPLOY_SHA" \
            --release-id "${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --gpu-request "$GPU_REQUEST" \
            --unit-file deploy/gpu-worker/robotswarm-gpu-worker.service

      - name: Resume scheduling
        if: ${{ always() && steps.drain.outcome == 'success' }}
        shell: bash
        env:
          DRAIN_LEASE_ID: ${{ steps.drain.outputs.lease_id }}
          DRAIN_BACKEND_URL: ${{ steps.drain.outputs.backend_url }}
          WORKER_DEPLOY_OUTCOME: ${{ steps.worker_deploy.outcome }}
          WORKER_SNAPSHOT_OUTCOME: ${{ steps.worker_snapshot.outcome }}
          PREVIOUS_WORKER_TARGET: ${{ steps.worker_snapshot.outputs.previous_target }}
          PREVIOUS_RELEASE_DIGEST: ${{ steps.worker_snapshot.outputs.previous_release_digest }}
          PREVIOUS_UNIT_DIGEST: ${{ steps.worker_snapshot.outputs.previous_unit_digest }}
        run: |
          set -euo pipefail

          runtime_dir="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$runtime_dir}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=$runtime_dir/bus}"

          identity_file="$HOME/.config/robotswarm/gpu-worker-identity.env"
          set -a
          source "$identity_file"
          set +a
          credential="${Worker__WorkerId}.${Worker__WorkerSecret}"

          if [[ "$WORKER_DEPLOY_OUTCOME" != "success" ]]; then
            if [[ "$WORKER_DEPLOY_OUTCOME" == "failure" \
                || "$WORKER_DEPLOY_OUTCOME" == "cancelled" ]]
            then
              if [[ "$WORKER_SNAPSHOT_OUTCOME" != "success" ]]; then
                echo "The pre-deployment snapshot is unavailable; scheduling remains drained." >&2
                exit 1
              fi

              current_link="$HOME/.local/share/robotswarm-gpu-worker/current"
              installed_unit="$HOME/.config/systemd/user/robotswarm-gpu-worker.service"
              if [[ "$PREVIOUS_WORKER_TARGET" == "absent" ]]; then
                test ! -e "$current_link" || {
                  echo "Rollback left an unexpected worker release; scheduling remains drained." >&2
                  exit 1
                }
              else
                restored_target="$(readlink -f "$current_link")"
                restored_release_digest="$(
                  find "$restored_target" -type f -print0 \
                    | sort --zero-terminated \
                    | xargs --null --no-run-if-empty sha256sum \
                    | sha256sum \
                    | cut -d ' ' -f 1
                )"
                if [[ "$restored_target" != "$PREVIOUS_WORKER_TARGET" \
                    || "$restored_release_digest" != "$PREVIOUS_RELEASE_DIGEST" ]]
                then
                  echo "Rollback did not restore the exact worker release; scheduling remains drained." >&2
                  exit 1
                fi
              fi

              if [[ "$PREVIOUS_UNIT_DIGEST" == "absent" ]]; then
                test ! -e "$installed_unit" || {
                  echo "Rollback left an unexpected worker unit; scheduling remains drained." >&2
                  exit 1
                }
              else
                restored_unit_digest="$(sha256sum "$installed_unit" | cut -d ' ' -f 1)"
                if [[ "$restored_unit_digest" != "$PREVIOUS_UNIT_DIGEST" ]]; then
                  echo "Rollback did not restore the exact worker unit; scheduling remains drained." >&2
                  exit 1
                fi
              fi
            elif [[ "$WORKER_DEPLOY_OUTCOME" != "skipped" ]]; then
              echo "Unknown worker deployment outcome; scheduling remains drained." >&2
              exit 1
            fi

            if ! systemctl --user is-active --quiet robotswarm-gpu-worker.service; then
              echo "Worker rollback is not active; scheduling remains drained." >&2
              exit 1
            fi
            restored_pid="$(
              systemctl --user show \
                --property MainPID \
                --value \
                robotswarm-gpu-worker.service
            )"
            [[ "$restored_pid" =~ ^[1-9][0-9]*$ ]] || {
              echo "Worker rollback has no live process; scheduling remains drained." >&2
              exit 1
            }

            baseline_response="$({
              curl --silent --show-error --fail \
                --connect-timeout 5 \
                --max-time 20 \
                --header "Authorization: Bearer $credential" \
                "$DRAIN_BACKEND_URL/api/worker-maintenance/drain/$DRAIN_LEASE_ID"
            })"
            baseline_reported_at="$(
              STATUS="$baseline_response" python3 - <<'PY'
          import json
          import os

          status = json.loads(os.environ["STATUS"])
          print(status.get("activeSessionsReportedAt") or "")
          PY
            )"
            recovery_deadline=$((SECONDS + 45))
            recovered="false"
            while (( SECONDS < recovery_deadline )); do
              if response="$({
                curl --silent --show-error --fail \
                  --connect-timeout 5 \
                  --max-time 20 \
                  --header "Authorization: Bearer $credential" \
                  "$DRAIN_BACKEND_URL/api/worker-maintenance/drain/$DRAIN_LEASE_ID"
              })" \
                && STATUS="$response" \
                  BASELINE_REPORTED_AT="$baseline_reported_at" \
                  python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os

          status = json.loads(os.environ["STATUS"])
          reported_at = status.get("activeSessionsReportedAt")
          if not reported_at:
              raise SystemExit(1)
          reported = datetime.fromisoformat(reported_at.replace("Z", "+00:00"))
          if reported.tzinfo is None:
              reported = reported.replace(tzinfo=timezone.utc)
          else:
              reported = reported.astimezone(timezone.utc)

          baseline_text = os.environ["BASELINE_REPORTED_AT"]
          if baseline_text:
              baseline = datetime.fromisoformat(
                  baseline_text.replace("Z", "+00:00")
              )
              if baseline.tzinfo is None:
                  baseline = baseline.replace(tzinfo=timezone.utc)
              else:
                  baseline = baseline.astimezone(timezone.utc)
              fresh = reported > baseline
          else:
              fresh = True
          empty = (
              status.get("isDrained") is True
              and status.get("trackedSessionCount") == 0
              and status.get("reportedActiveSessionCount") == 0
          )
          raise SystemExit(0 if fresh and empty else 1)
          PY
              then
                recovered="true"
                break
              fi
              sleep 2
            done

            latest_pid="$(
              systemctl --user show \
                --property MainPID \
                --value \
                robotswarm-gpu-worker.service
            )"
            if [[ "$recovered" != "true" \
                || "$latest_pid" != "$restored_pid" ]] \
                || ! systemctl --user is-active --quiet robotswarm-gpu-worker.service
            then
              echo "Worker did not recover a fresh heartbeat; scheduling remains drained." >&2
              exit 1
            fi
          fi

          status="$({
            curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer $credential" \
              "$DRAIN_BACKEND_URL/api/worker-maintenance/drain/$DRAIN_LEASE_ID"
          })"
          unset credential Worker__WorkerSecret
          test "$status" = "204"
