name: Deploy GPU Swarm Worker

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main-branch SHA whose Check project run succeeded
        required: true
        type: string
      confirm_drained:
        description: I disabled new scheduling and confirmed there are no active GPU sessions
        required: true
        default: false
        type: boolean
      confirm_backend_ready:
        description: The backend for this SHA is deployed, or this is a backward-compatible worker-only change
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: production-gpu-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [wsl, gpu, gpu-worker-prod]
    environment: gpu-worker-production
    timeout-minutes: 90
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      BACKEND_CONFIRMED: ${{ inputs.confirm_backend_ready }}
      DRAIN_CONFIRMED: ${{ inputs.confirm_drained }}
      GPU_REQUEST: ${{ vars.GPU_WORKER_GPU_REQUEST || 'device=0' }}
      HARNESS_SHA: ${{ github.workflow_sha }}
      ROS_IMAGE_REPOSITORY: robotswarm/ros-noetic
      WORKFLOW_REF: ${{ github.ref }}

    steps:
      - name: Verify successful main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$BACKEND_CONFIRMED" = "true"
          test "$DRAIN_CONFIRMED" = "true"
          test "$WORKFLOW_REF" = "refs/heads/main"

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          revision = os.environ["DEPLOY_SHA"]
          token = os.environ["GH_TOKEN"]
          query = urllib.parse.urlencode(
              {
                  "branch": "main",
                  "event": "push",
                  "head_sha": revision,
                  "status": "completed",
                  "per_page": 20,
              }
          )
          url = (
              f"https://api.github.com/repos/{repository}"
              f"/actions/workflows/ci.yml/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])

          passed = any(
              run.get("conclusion") == "success"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == revision
              for run in runs
          )
          if not passed:
              raise SystemExit(
                  "No successful Check project push run exists for this main SHA."
              )
          PY

      - name: Check out protected deployment harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: _deploy/deploy-harness
          persist-credentials: false
          sparse-checkout: deploy/gpu-worker

      - name: Check out tested source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          path: _deploy/gpu-source
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.422"

      - name: Check WSL GPU runner
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          grep -qi microsoft /proc/sys/kernel/osrelease
          command -v docker
          command -v python3
          command -v systemctl

          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
          grep -Fq \
            "Worker ready for control-plane commands. ImageVersion={ImageVersion}" \
            SwarmWorker/Services/WorkerAgent.cs

          runtime_dir="/run/user/$(id -u)"
          test -d "$runtime_dir"
          test -S "$runtime_dir/bus"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"

          systemctl --user show-environment >/dev/null
          docker version
          docker info >/dev/null
          test -s "$HOME/.config/robotswarm/gpu-worker-identity.env"

          running_sessions="$(
            docker ps --quiet \
              --filter "label=io.robotswarm.managed=true"
          )"
          if test -n "$running_sessions"; then
            echo "Managed simulation containers are still running." >&2
            exit 1
          fi

          case "$GPU_REQUEST" in
            all|device=*) ;;
            *)
              echo "GPU_REQUEST must be 'all' or a Docker device request." >&2
              exit 1
              ;;
          esac

      - name: Test GPU worker
        working-directory: _deploy/gpu-source
        run: dotnet test SwarmWorker.Tests/SwarmWorker.Tests.csproj --configuration Release

      - name: Test atomic worker deployment
        working-directory: _deploy/deploy-harness
        run: deploy/gpu-worker/test-deploy.sh

      - name: Test swarm algorithms
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=swarm_ws/src/robot_swarm_bridge/src:swarm_ws/src/robot_swarm_bridge/scripts \
            python3 -m unittest discover \
              -s swarm_ws/src/robot_swarm_bridge/test \
              -p "test_*.py" \
              -v

      - name: Build immutable ROS image
        id: ros_image
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          image_tag="${ROS_IMAGE_REPOSITORY}:git-${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            --label "io.robotswarm.github-run=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --tag "$image_tag" \
            --file swarm_ws/Dockerfile \
            swarm_ws

          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Docker returned an invalid image ID: $image_id" >&2
            exit 1
          fi

          image_revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$image_id"
          )"
          test "$image_revision" = "$DEPLOY_SHA"

          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Smoke-test ROS and NVIDIA runtime
        shell: bash
        working-directory: _deploy/gpu-source
        env:
          ROS_IMAGE_ID: ${{ steps.ros_image.outputs.image_id }}
        run: |
          set -euo pipefail

          docker run --rm "$ROS_IMAGE_ID" \
            roslaunch --nodes robot_swarm_bridge swarm_main.launch \
              robot_count:=0 gui:=false rviz:=false

          docker run --rm --gpus "$GPU_REQUEST" "$ROS_IMAGE_ID" \
            nvidia-smi --query-gpu=name,driver_version --format=csv,noheader

      - name: Publish self-contained worker
        id: worker_publish
        shell: bash
        working-directory: _deploy/gpu-source
        run: |
          set -euo pipefail

          publish_dir="${RUNNER_TEMP}/robotswarm-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$publish_dir"
          mkdir -p "$publish_dir"

          dotnet publish SwarmWorker/SwarmWorker.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output "$publish_dir"

          test -x "$publish_dir/SwarmWorker"
          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy worker and verify readiness
        shell: bash
        working-directory: _deploy/deploy-harness
        env:
          ROS_IMAGE_ID: ${{ steps.ros_image.outputs.image_id }}
          WORKER_PUBLISH_DIR: ${{ steps.worker_publish.outputs.publish_dir }}
        run: |
          set -euo pipefail

          deploy/gpu-worker/deploy.sh \
            --publish-dir "$WORKER_PUBLISH_DIR" \
            --image-id "$ROS_IMAGE_ID" \
            --revision "$DEPLOY_SHA" \
            --release-id "${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --gpu-request "$GPU_REQUEST" \
            --unit-file deploy/gpu-worker/robotswarm-gpu-worker.service
