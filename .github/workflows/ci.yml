name: Check project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build backend
        run: dotnet build SwarmBackend/SwarmBackend.csproj --configuration Release

      - name: Test backend control plane
        run: dotnet test SwarmBackend.Tests/SwarmBackend.Tests.csproj --configuration Release

      - name: Check migrations
        run: |
          dotnet tool install --global dotnet-ef --version 7.0.5
          dotnet ef migrations script --idempotent \
            --project SwarmBackend/SwarmBackend.csproj \
            --output /tmp/robotswarm-migrations.sql

      - name: Check production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test
          AppSettings__Secret: test
          AppSettings__Issuer: https://robot.zerav.la
          Cors__Origins__0: https://rs.zerav.la
          BACKEND_PUBLISH_IP: 10.0.0.126

      - name: Test GPU worker
        run: dotnet test SwarmWorker.Tests/SwarmWorker.Tests.csproj --configuration Release

      - name: Test viewer publisher helper
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/robotswarm-viewer-pycache" \
            python3 -m py_compile deploy/gpu-worker/robotswarm-viewer-publisher
          deploy/gpu-worker/test-viewer-publisher.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SwarmFrontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: SwarmFrontend/package-lock.json

      - run: npm ci
      - name: Lint session control frontend
        run: |
          npm run lint -- --quiet \
            src/app/auth/Auth.js \
            src/app/constants/constants.js \
            src/app/fuse-configs/navigationGTSConfig.js \
            src/app/main/apps/GeeTS/Realtime/RealtimeConfigApp.js \
            src/app/main/apps/GeeTS/Realtime/RealtimeConfigAppConfig.js \
            src/app/main/apps/GeeTS/Realtime/VncViewer.js \
            src/app/main/apps/GeeTS/Realtime/SimulationWorkspace.js \
            src/app/main/apps/GeeTS/Realtime/SwarmTaskPanel.js \
            src/app/main/apps/GeeTS/Realtime/WhepViewer.js \
            src/app/main/apps/GeeTS/Realtime/transportTaskStatus.js \
            src/app/services/jwtService/authTokenUtils.js \
            src/app/services/jwtService/jwtService.js \
            src/services/SimulationSessionService.js
      - name: Test frontend session and authentication helpers
        run: npm test -- --watchAll=false
      - name: Build frontend
        run: npm run build
        env:
          CI: "false"

  ros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare ROS test environment
        run: |
          python3 -m venv /tmp/robotswarm-ros-ci
          /tmp/robotswarm-ros-ci/bin/pip install \
            --disable-pip-version-check \
            numpy==1.26.4

      - name: Test swarm algorithms
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=swarm_ws/src/robot_swarm_bridge/src:swarm_ws/src/robot_swarm_bridge/scripts \
            /tmp/robotswarm-ros-ci/bin/python -m unittest discover \
              -s swarm_ws/src/robot_swarm_bridge/test \
              -p "test_*.py" \
              -v

      - name: Build ROS image
        run: docker build --file swarm_ws/Dockerfile swarm_ws
