name: Deploy Backend and Database

on:
  workflow_run:
    workflows: ["Check project"]
    branches: [main]
    types: [completed]

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - name: Require successful CI
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "The project checks did not pass; backend deployment is blocked." >&2
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check backend deployment scope
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse HEAD^ >/dev/null 2>&1
          then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git ls-tree -r --name-only HEAD)"
          fi

          deploy=false
          while IFS= read -r path
          do
            case "$path" in
              SwarmBackend/*|infra/*|docker-compose.prod.yml|.dockerignore|.github/workflows/backend_workflow.yml)
                deploy=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: [self-hosted, backend-prod]
    environment: production
    defaults:
      run:
        working-directory: _deploy/backend-source
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      BACKEND_IMAGE: swarmbackend:${{ github.event.workflow_run.head_sha }}
      AppSettings__Secret: ${{ secrets.APPSETTINGS_SECRET }}
      AppSettings__Issuer: https://robot.zerav.la
      Cors__Origins__0: https://rs.zerav.la
      LegacyControl__Enabled: "false"
      BACKEND_PUBLISH_IP: ${{ vars.BACKEND_PUBLISH_IP }}
      Viewer__PublicBaseUrl: ${{ vars.VIEWER_PUBLIC_BASE_URL }}
      Viewer__WorkerPublishingEnabled: "false"
      BootstrapAdmin__Email: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      BootstrapAdmin__Password: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      MEDIA_PUBLISH_IP: ${{ vars.MEDIA_PUBLISH_IP }}
      MEDIA_WEBRTC_IP: ${{ vars.MEDIA_WEBRTC_IP }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: _deploy/backend-source

      - name: Check production configuration
        run: |
          test -n "$DB_USER"
          test -n "$DB_PASSWORD"
          test -n "$DB_NAME"
          test -n "$AppSettings__Secret"
          test -n "$BACKEND_PUBLISH_IP"

      - name: Build Backend Docker image
        run: docker build -t "$BACKEND_IMAGE" -f SwarmBackend/Dockerfile .

      - name: Deploy with Docker Compose
        run: |
          deploy_stack() {
            docker compose -f docker-compose.prod.yml \
              up -d --remove-orphans --wait --wait-timeout 180 \
              db backend media || return

            published_endpoint="$(docker port backend_prod 44336/tcp)" || return
            if test "$published_endpoint" != "$BACKEND_PUBLISH_IP:44336"
            then
              echo "Backend published at $published_endpoint; expected $BACKEND_PUBLISH_IP:44336." >&2
              return 1
            fi

            curl --fail --show-error --silent \
              --connect-timeout 5 --max-time 15 \
              "http://$BACKEND_PUBLISH_IP:44336/health" >/dev/null
          }

          previous_image="$(docker inspect backend_prod --format '{{.Config.Image}}' 2>/dev/null || true)"
          previous_endpoint="$(docker port backend_prod 44336/tcp 2>/dev/null || true)"
          previous_publish_ip="${previous_endpoint%:44336}"
          compose_service="$(
            docker inspect backend_prod \
              --format '{{index .Config.Labels "com.docker.compose.service"}}' \
              2>/dev/null || true
          )"

          if test -n "$previous_image" && test "$compose_service" != "backend"
          then
            echo "Adopting the backend container created by the previous deployment workflow."
            docker stop backend_prod
            docker rm backend_prod
          fi

          if ! deploy_stack
          then
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=200 backend media
            if test -n "$previous_image"
            then
              echo "Restoring the backend image that was active before this deployment."
              BACKEND_IMAGE="$previous_image" \
              BACKEND_PUBLISH_IP="${previous_publish_ip:-127.0.0.1}" \
                docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 180 backend
            fi
            exit 1
          fi

      - name: Prune old Docker images
        run: docker image prune -f --filter "until=168h"
